<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>A day inside the company — CISSP walkthrough</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F4F7;--stage:#FFFFFF;--fg:#111418;--fg2:#4B535B;--fg3:#78828B;
 --line:#DCE1E7;--line2:#BAC2CB;--acc:#2E5FD1;--ok:#1C7A4F;
 --p1:#2E5FD1;--p2:#B04429;--p3:#0E7A63;--p4:#7E3BA6;
 --furn:#E3E8EE;--furn2:#C9D1DA;--ink:#0E1419;color-scheme:light}
.D1{--acc:#2E5FD1}.D2{--acc:#0E7A63}.D3{--acc:#7E3BA6}.D4{--acc:#0A6D9C}
.D5{--acc:#9A5B06}.D6{--acc:#A62D5A}.D7{--acc:#B04429}.D8{--acc:#3C7A1C}
@media (prefers-color-scheme:dark){:root{--bg:#0E1113;--stage:#161A1F;--fg:#F0F2F4;--fg2:#AEB7BF;
 --fg3:#848E97;--line:#262C33;--line2:#3C444D;--acc:#7FA6FF;--ok:#5FC08F;
 --p1:#7FA6FF;--p2:#F09478;--p3:#4FC9A9;--p4:#C293E8;
 --furn:#222830;--furn2:#333B45;--ink:#05070A;color-scheme:dark}
 .D1{--acc:#7FA6FF}.D2{--acc:#4FC9A9}.D3{--acc:#C293E8}.D4{--acc:#5FBCEA}
 .D5{--acc:#E6B257}.D6{--acc:#F093B4}.D7{--acc:#F09478}.D8{--acc:#9CD06A}}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Lexend,system-ui,sans-serif;
 font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;
 display:flex;flex-direction:column}
em{font-style:normal}
button{font:inherit}

/* top */
.bar{flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:10px clamp(14px,2.5vw,26px);
 border-bottom:1px solid var(--line);background:var(--stage)}
.bar .ttl{font-size:14.5px;font-weight:600;white-space:nowrap}
.bar .ttl em{color:var(--fg3);font-weight:400}
.chip{font-size:12.5px;font-weight:600;color:#fff;background:var(--acc);padding:3px 11px;border-radius:999px;white-space:nowrap}
.bar .sp{flex:1}
.bar .mini{width:140px;height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.bar .mini i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
.bar .cnt{font-size:13.5px;color:var(--fg2);font-variant-numeric:tabular-nums;white-space:nowrap}
.ib{border:1px solid var(--line2);background:var(--stage);color:var(--fg);border-radius:8px;
 padding:6px 12px;font-size:13.5px;cursor:pointer;white-space:nowrap}
.ib:hover{border-color:var(--acc);color:var(--acc)}
.xnav{display:flex;gap:3px}
.xnav a{font-size:13px;color:var(--fg2);padding:5px 10px;border-radius:7px;text-decoration:none;font-weight:500}
.xnav a:hover{background:var(--line)} .xnav a.here{background:var(--acc);color:#fff}

/* body */
.body{flex:1;display:grid;grid-template-columns:min-content minmax(0,1fr);min-height:0}
.rail{width:276px;overflow:auto;border-right:1px solid var(--line);background:var(--stage);padding:10px 0 30px}
.rail.hide{display:none}
.rb{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;width:100%;
 border:0;background:none;color:var(--fg);text-align:left;padding:9px 16px;cursor:pointer;
 border-left:3px solid transparent}
.rb:hover{background:var(--bg)}
.rb.cur{background:var(--bg);border-left-color:var(--acc)}
.rb.cur .rt{color:var(--acc);font-weight:600}
.rb.seen .rn{background:var(--ok);color:#fff;border-color:var(--ok)}
.rn{width:26px;height:26px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;
 font-size:11.5px;color:var(--fg3);font-variant-numeric:tabular-nums}
.rt{font-size:14px;line-height:1.3}
.rt em{display:block;font-size:12.5px;color:var(--fg3)}
.rd{font-size:11px;color:var(--fg3);border:1px solid var(--line2);border-radius:5px;padding:1px 6px}

.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.stagewrap{flex:1;min-height:0;padding:clamp(8px,1.6vh,18px) clamp(10px,2vw,26px) 0;display:flex}
.stage{flex:1;background:var(--stage);border:1px solid var(--line);border-radius:14px;
 position:relative;overflow:hidden;display:flex}
.scene{width:100%;height:100%;display:none}
.scene.on{display:block}

/* vẽ */
.room{fill:none;stroke:var(--line2);stroke-width:2;stroke-dasharray:10 7}
.roomt{font-size:17px;font-weight:600;fill:var(--fg2)}
.roomv{font-size:14px;fill:var(--fg3)}
.obj{transition:opacity .35s}
.furn{fill:var(--furn);stroke:var(--furn2);stroke-width:1.5}
.unit{fill:var(--furn2)}
.led{fill:var(--ok)}
.led2{fill:var(--furn)}
.scr{fill:var(--ink);stroke:var(--furn2);stroke-width:1.5}
.beam{fill:var(--acc);opacity:.07}
.shadow{fill:#000;opacity:.07}
.ph{fill:var(--furn2)}
.pb{stroke:none}
.pa{stroke-width:7;stroke-linecap:round;fill:none}
.pl{stroke:var(--furn2);stroke-width:7;stroke-linecap:round;fill:none}
.lb{font-size:13.5px;font-weight:500;fill:var(--fg)}
.lbs{font-size:12px;fill:var(--fg3)}
.mon{fill:var(--ink);stroke:var(--furn2);stroke-width:1.5}
.monbar{fill:var(--furn2)}
.montitle{font-size:13px;font-weight:600;fill:var(--ink)}
.code{font-family:"JetBrains Mono",monospace;font-size:13px;fill:#9FE6C4}
.cardbg{fill:var(--bg);stroke:var(--line2);stroke-width:1.5}
.cardbar{fill:var(--line2)}
.cardt{font-size:15px;font-weight:600;fill:var(--fg)}
.cards{font-size:12.5px;fill:var(--fg2)}
.obj.dim{opacity:.26}
.obj.hot .cardbg{stroke:var(--acc);stroke-width:2.5;fill:color-mix(in srgb,var(--acc) 10%,var(--bg))}
.obj.hot .cardbar{fill:var(--acc)}
.obj.hot .cardt,.obj.hot .lb,.obj.hot .montitle{fill:var(--acc)}
.obj.hot .furn,.obj.hot .mon,.obj.hot .scr{stroke:var(--acc);stroke-width:2.5}
.obj.hot .ph{fill:var(--acc)}
.pov{opacity:0;transition:transform .75s cubic-bezier(.4,0,.2,1),opacity .4s}
.povdot{fill:var(--acc)}
.povring{fill:none;stroke:var(--acc);stroke-width:2.5;opacity:.5}
.pov.on{opacity:1}
.pov.on .povring{animation:ping 1.9s ease-out infinite}
@keyframes ping{0%{r:14;opacity:.75}100%{r:46;opacity:0}}
@media (prefers-reduced-motion:reduce){.pov{transition:none}.pov.on .povring{animation:none}}

/* caption */
.cap{flex:0 0 auto;padding:clamp(10px,1.8vh,18px) clamp(14px,2.5vw,30px) clamp(12px,2vh,20px);
 display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:end}
.capt .tag{display:inline-block;font-size:11.5px;font-weight:600;color:#fff;background:var(--acc);
 padding:2px 9px;border-radius:999px;margin-bottom:6px}
.capt .en{font-size:clamp(17px,2vw,22px);font-weight:500;line-height:1.35}
.capt .vi{font-size:clamp(14.5px,1.6vw,17px);color:var(--fg2);margin-top:5px;line-height:1.45}
.acts{display:flex;gap:10px;align-items:center}
.acts button{border:1px solid var(--line2);background:var(--stage);color:var(--fg);border-radius:10px;
 padding:11px 20px;font-size:15px;font-weight:600;cursor:pointer;white-space:nowrap}
.acts button:hover{border-color:var(--acc);color:var(--acc)}
.acts button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.acts .dots{display:flex;gap:5px;margin-right:4px}
.acts .dots i{width:8px;height:8px;border-radius:50%;background:var(--line2)}
.acts .dots i.ok{background:var(--acc)}

/* lead overlay */
.lead{position:absolute;inset:0;background:color-mix(in srgb,var(--stage) 93%,transparent);
 display:grid;place-items:center;padding:clamp(20px,5vw,70px);text-align:center;z-index:5}
.lead.off{display:none}
.lead .in{max-width:62ch}
.lead h2{font-size:clamp(24px,3.4vw,38px);font-weight:600;line-height:1.15}
.lead .v{font-size:clamp(16px,2vw,20px);color:var(--acc);font-weight:500;margin-top:8px}
.lead p{margin-top:18px;font-size:clamp(15px,1.7vw,18px)}
.lead p em{display:block;color:var(--fg2);font-size:clamp(14px,1.5vw,16px);margin-top:8px}
.lead button{margin-top:26px;border:0;background:var(--acc);color:#fff;border-radius:11px;
 padding:13px 30px;font-size:16px;font-weight:600;cursor:pointer}

@media (max-width:900px){
 .rail{position:absolute;z-index:20;height:calc(100% - 50px);box-shadow:0 0 30px rgba(0,0,0,.2)}
 .rail.hide{display:none}
 .cap{grid-template-columns:1fr;gap:10px}
 .acts{justify-content:space-between}
 .bar .ttl em,.bar .mini{display:none}
 body{font-size:16px}
}
</style>
</head>

<script>
const S = [{"id": "s0", "dom": "Start", "en": "08:40 — the front door", "vi": "8 giờ 40 — trước cửa công ty", "lead_en": "You start today as a security analyst at HaAn Corp: 600 people, online retail, one data centre and a slice of cloud. Over the next twelve rooms you will meet all eight domains where they actually live.", "lead_vi": "Hôm nay bạn bắt đầu làm chuyên viên an ninh tại HaAn Corp: 600 người, bán lẻ trực tuyến, một trung tâm dữ liệu và một phần trên cloud. Mười hai căn phòng tới đây sẽ cho bạn gặp cả tám domain ở đúng nơi chúng sống.", "steps": [{"o": "c-out", "en": "Before you even reach the door, controls are already working on you.", "vi": "Bạn chưa tới cửa thì đã có kiểm soát đang làm việc với bạn rồi.", "tag": "D7"}, {"o": "b-fence", "en": "Bollards and fencing are physical, preventive controls. They do not detect anything; they stop a vehicle.", "vi": "Cột chắn và hàng rào là kiểm soát vật lý, mang tính phòng ngừa. Chúng không phát hiện gì cả; chúng chặn một chiếc xe.", "tag": "D7"}, {"o": "b-light", "en": "Lighting is a deterrent control. Nothing is blocked, but far fewer people try.", "vi": "Chiếu sáng là kiểm soát răn đe. Không chặn được gì, nhưng số người thử giảm hẳn.", "tag": "D7"}, {"o": "p-guard", "en": "The guard is the only control here with judgement. A camera records; a guard decides.", "vi": "Bảo vệ là kiểm soát duy nhất ở đây có khả năng phán đoán. Camera chỉ ghi lại; bảo vệ thì quyết định.", "tag": "D7"}, {"o": "p-ciso", "en": "Your guide is the CISO. She reports to the CEO, not to the IT manager — independence matters when you must report bad news.", "vi": "Người dẫn bạn là CISO. Chị báo cáo thẳng CEO chứ không qua trưởng phòng IT — độc lập mới dám báo tin xấu.", "tag": "D1"}, {"o": "b-you", "en": "Your job for the next hour: in every room, name the control, its type and its purpose.", "vi": "Việc của bạn trong một giờ tới: ở mỗi phòng, gọi tên kiểm soát, loại của nó và mục đích của nó.", "tag": "D1"}], "c": {"d-front": [180, 385], "c-out": [138, 134], "b-fence": [440, 195], "b-light": [740, 195], "p-guard": [380, 396], "p-ciso": [620, 396], "b-you": [910, 420]}}, {"id": "s1", "dom": "D7", "en": "Reception and the way in", "vi": "Quầy lễ tân và đường vào", "lead_en": "Physical security is the first layer, and the only layer that protects people rather than data.", "lead_vi": "An ninh vật lý là lớp đầu tiên, và là lớp duy nhất bảo vệ con người chứ không phải dữ liệu.", "steps": [{"o": "b-badge", "en": "Your badge is something you have. Add the PIN and it becomes two factors at a door.", "vi": "Thẻ của bạn là thứ bạn có. Thêm mã PIN thì cánh cửa trở thành xác thực hai yếu tố.", "tag": "D5"}, {"o": "b-man", "en": "The mantrap exists for one reason: one person per entry, so nobody rides in on your badge.", "vi": "Mantrap tồn tại vì đúng một lý do: mỗi lần một người, để không ai đi ké thẻ của bạn.", "tag": "D7"}, {"o": "b-tail", "en": "Someone carrying a box asks you to hold the door. That is tailgating, and politeness is the attack.", "vi": "Một người ôm thùng giấy nhờ bạn giữ cửa. Đó là tailgating, và lịch sự chính là đòn tấn công.", "tag": "D7"}, {"o": "b-log", "en": "Visitors get a different coloured badge and an escort. The log is a detective control, not a preventive one.", "vi": "Khách được thẻ khác màu và có người đi kèm. Cuốn sổ là kiểm soát phát hiện, không phải phòng ngừa.", "tag": "D7"}, {"o": "c-in", "en": "The camera detects and records. It prevents nothing — that distinction is worth points on the exam.", "vi": "Camera phát hiện và ghi lại. Nó không ngăn được gì — phân biệt đó đáng điểm trong bài thi.", "tag": "D7"}, {"o": "b-safe", "en": "Storage doors fail secure to protect assets. Fire exits fail safe to protect people. People always win.", "vi": "Cửa kho khóa lại khi mất điện để giữ tài sản. Cửa thoát hiểm mở ra để giữ mạng người. Con người luôn thắng.", "tag": "D7"}], "c": {"dk-rec": [200, 220], "p-rec": [305, 296], "b-badge": [545, 190], "b-man": [545, 360], "b-log": [545, 525], "c-in": [778, 154], "b-tail": [910, 360], "b-safe": [910, 520]}}, {"id": "s2", "dom": "D1", "en": "The boardroom", "vi": "Phòng họp ban lãnh đạo", "lead_en": "Everything downstairs is paid for by a decision taken in this room.", "lead_vi": "Mọi thứ ở tầng dưới đều được chi trả bởi một quyết định đưa ra trong căn phòng này.", "steps": [{"o": "p-ceo", "en": "Senior management carries the final liability. Delegating the work never delegates the responsibility.", "vi": "Lãnh đạo cấp cao gánh trách nhiệm cuối cùng. Giao việc đi thì vẫn không giao được trách nhiệm.", "tag": "D1"}, {"o": "b-pol", "en": "The policy is one page and mandatory. Standards name the technology, procedures give the steps, guidelines only suggest.", "vi": "Chính sách dài một trang và bắt buộc. Standard nêu công nghệ, procedure nêu từng bước, guideline chỉ gợi ý.", "tag": "D1"}, {"o": "b-ale", "en": "Asset value times exposure factor gives one loss. Times the yearly rate gives ALE, the number this room argues about.", "vi": "Giá trị tài sản nhân tỷ lệ mất mát ra thiệt hại một lần. Nhân số lần mỗi năm ra ALE, con số mà căn phòng này tranh luận.", "tag": "D1"}, {"o": "sc-risk", "en": "Residual risk is accepted in writing, by name, with a date. A hallway conversation is not acceptance.", "vi": "Rủi ro tồn dư được chấp nhận bằng văn bản, có tên người, có ngày. Một câu nói ngoài hành lang không phải là chấp nhận.", "tag": "D1"}, {"o": "p-cfo", "en": "Four treatments only: mitigate, transfer, avoid, accept. Insurance is transfer and it never moves the legal duty.", "vi": "Chỉ có bốn cách xử lý: giảm, chuyển, né, chấp nhận. Bảo hiểm là chuyển giao và nó không bao giờ chuyển được nghĩa vụ pháp lý.", "tag": "D1"}, {"o": "b-care", "en": "Due care is doing the right thing. Due diligence is checking. Missing either one is negligence.", "vi": "Due care là làm đúng. Due diligence là kiểm tra. Thiếu một trong hai là tắc trách.", "tag": "D1"}], "c": {"dk-board": [420, 306], "p-ceo": [300, 146], "p-cfo": [430, 146], "p-ciso2": [560, 146], "sc-risk": [890, 225], "b-pol": [280, 495], "b-ale": [615, 495], "b-care": [945, 495]}}, {"id": "s3", "dom": "D1", "en": "The HR corner", "vi": "Góc nhân sự", "lead_en": "Most of what the exam calls administrative controls is done by people who have never read a firewall rule.", "lead_vi": "Phần lớn thứ mà đề thi gọi là kiểm soát hành chính lại do những người chưa bao giờ đọc một luật firewall thực hiện.", "steps": [{"o": "b-screen", "en": "Screening depth matches the role. The person who will hold the keys to the core banking system is checked harder.", "vi": "Mức thẩm tra tương xứng với vị trí. Người sẽ giữ chìa khóa hệ thống lõi thì bị kiểm tra kỹ hơn.", "tag": "D1"}, {"o": "b-nda", "en": "The NDA is signed on day one and read back on the last day. Legal protection, not a technical control.", "vi": "NDA ký ngày đầu và đọc lại vào ngày cuối. Đó là bảo vệ pháp lý, không phải kiểm soát kỹ thuật.", "tag": "D1"}, {"o": "b-least", "en": "Access is provisioned from the job role, not from a favour. Least privilege starts at hour one.", "vi": "Quyền được cấp theo chức danh, không phải theo quan hệ. Least privilege bắt đầu từ giờ đầu tiên.", "tag": "D5"}, {"o": "p-hr", "en": "HR is the trigger for identity, not an email asking IT for an account. One source of truth.", "vi": "Nhân sự là nơi kích hoạt việc cấp danh tính, không phải một email nhờ IT mở tài khoản. Một nguồn sự thật duy nhất.", "tag": "D5"}, {"o": "b-off", "en": "On the last day access disappears automatically. For a dismissal, access is cut before the conversation starts.", "vi": "Ngày cuối, quyền tự động biến mất. Với trường hợp sa thải, cắt quyền trước khi cuộc nói chuyện bắt đầu.", "tag": "D1"}, {"o": "p-new", "en": "Rotation, mandatory vacation and separation of duties all live here too — fraud controls disguised as HR policy.", "vi": "Luân chuyển công việc, nghỉ phép bắt buộc và tách biệt nhiệm vụ cũng nằm ở đây — kiểm soát gian lận khoác áo chính sách nhân sự.", "tag": "D7"}], "c": {"dk-hr": [220, 230], "p-hr": [312, 308], "p-new": [470, 308], "b-screen": [840, 180], "b-nda": [715, 330], "b-least": [965, 330], "b-off": [840, 485]}}, {"id": "s4", "dom": "D2", "en": "The records room", "vi": "Phòng hồ sơ", "lead_en": "Before you can protect data you have to know what it is, who owns it and how long it may live.", "lead_vi": "Muốn bảo vệ dữ liệu thì trước hết phải biết nó là gì, của ai và được sống bao lâu.", "steps": [{"o": "cb-conf", "en": "Classification is a business decision, not a technical one. It decides how much protection is enough.", "vi": "Phân loại là quyết định nghiệp vụ, không phải kỹ thuật. Nó quyết định bảo vệ bao nhiêu là đủ.", "tag": "D2"}, {"o": "p-owner", "en": "The data owner is a senior manager. He sets the classification and approves who may read it.", "vi": "Data owner là một quản lý cấp cao. Anh ấy gán mức phân loại và phê duyệt ai được đọc.", "tag": "D2"}, {"o": "p-cust", "en": "The custodian runs backups and applies the controls. He executes; he does not decide.", "vi": "Custodian chạy sao lưu và áp dụng kiểm soát. Anh ấy thực thi; anh ấy không quyết định.", "tag": "D2"}, {"o": "b-label", "en": "A cabinet holding mixed levels is labelled at the highest level inside it. Same rule for a hard disk.", "vi": "Tủ chứa nhiều mức khác nhau thì dán nhãn theo mức cao nhất bên trong. Ổ cứng cũng theo đúng quy tắc đó.", "tag": "D2"}, {"o": "b-ret", "en": "Retention cuts both ways: too short breaks the law, too long turns old data into a liability.", "vi": "Thời hạn lưu cắt cả hai phía: quá ngắn thì phạm luật, quá dài thì dữ liệu cũ thành gánh nặng pháp lý.", "tag": "D2"}, {"o": "b-dest", "en": "Deleting only removes the index. Purge for reuse outside, destroy for the most sensitive, and remember degaussing does nothing to an SSD.", "vi": "Xóa chỉ gỡ mục lục. Purge khi đưa ra ngoài, hủy vật lý với loại nhạy cảm nhất, và nhớ rằng khử từ không có tác dụng gì với SSD.", "tag": "D2"}], "c": {"cb-pub": [195, 250], "cb-int": [345, 250], "cb-conf": [495, 250], "p-owner": [640, 196], "p-cust": [830, 196], "b-label": [310, 495], "b-ret": [650, 495], "b-dest": [970, 495]}}, {"id": "s5", "dom": "D4", "en": "The network room", "vi": "Phòng mạng", "lead_en": "Three racks and a diagram on the wall hold most of domain four.", "lead_vi": "Ba tủ rack và một sơ đồ trên tường chứa gần hết domain bốn.", "steps": [{"o": "rk-fw", "en": "The firewall reads rules top to bottom and the last line denies everything. That last line is implicit deny, written out loud.", "vi": "Firewall đọc luật từ trên xuống và dòng cuối từ chối tất cả. Dòng cuối đó chính là implicit deny, viết hẳn ra.", "tag": "D4"}, {"o": "b-rule", "en": "One permissive any-any rule placed at the top silently cancels every rule beneath it.", "vi": "Một luật any-any đặt trên cùng sẽ âm thầm vô hiệu mọi luật phía dưới nó.", "tag": "D4"}, {"o": "b-dmz", "en": "Public servers sit in the DMZ between two firewalls, and may not open connections inward on their own.", "vi": "Máy chủ công khai nằm trong DMZ giữa hai firewall, và tự nó không được mở kết nối vào trong.", "tag": "D4"}, {"o": "rk-ids", "en": "The IDS watches from beside the traffic and alerts. The IPS sits in the path and can block. Only one of them stops an attack.", "vi": "IDS đứng cạnh luồng lưu lượng và cảnh báo. IPS nằm trên đường đi và chặn được. Chỉ một trong hai dừng được cuộc tấn công.", "tag": "D4"}, {"o": "b-vlan", "en": "Segmentation means a cheap camera with a default password cannot reach the finance subnet.", "vi": "Phân đoạn nghĩa là một chiếc camera rẻ tiền dùng mật khẩu mặc định không chạm tới được mạng tài chính.", "tag": "D4"}, {"o": "b-wifi", "en": "Enterprise Wi-Fi authenticates each person. With a shared passphrase, every leaver keeps the key forever.", "vi": "Wi-Fi bản Enterprise xác thực từng người. Dùng mật khẩu chung thì mọi người nghỉ việc đều giữ chìa khóa mãi mãi.", "tag": "D4"}], "c": {"rk-fw": [185, 240], "rk-sw": [325, 240], "rk-ids": [465, 240], "p-net": [620, 166], "b-dmz": [920, 190], "b-vlan": [920, 355], "b-rule": [350, 500], "b-wifi": [840, 515]}}, {"id": "s6", "dom": "D5", "en": "The service desk", "vi": "Bàn hỗ trợ người dùng", "lead_en": "Identity is the real perimeter, and this desk is where it is handed out.", "lead_vi": "Danh tính mới là chu vi thật, và cái bàn này là nơi người ta phát nó ra.", "steps": [{"o": "b-iaaa", "en": "Four steps every login: claim an identity, prove it, be authorized, and be logged.", "vi": "Bốn bước của mọi lần đăng nhập: khai danh tính, chứng minh, được cho phép, và bị ghi lại.", "tag": "D5"}, {"o": "p-sd", "en": "A caller says he is the finance director and needs a password reset now. Urgency plus authority is the oldest attack in the book.", "vi": "Một người gọi tới nói mình là giám đốc tài chính và cần đổi mật khẩu ngay. Khẩn cấp cộng thẩm quyền là đòn tấn công cổ nhất.", "tag": "D1"}, {"o": "b-mfa", "en": "Two passwords are one factor. Something you know plus something you have is two.", "vi": "Hai mật khẩu vẫn là một yếu tố. Thứ bạn biết cộng thứ bạn có mới là hai.", "tag": "D5"}, {"o": "b-rbac", "en": "Permissions hang on roles. Joining a team means being added to one group, not to twelve.", "vi": "Quyền treo vào vai trò. Vào một đội nghĩa là được thêm vào một nhóm, không phải mười hai nhóm.", "tag": "D5"}, {"o": "b-pam", "en": "Nobody knows the root password. It is checked out for an hour, recorded, then rotated.", "vi": "Không ai biết mật khẩu root. Nó được mượn trong một giờ, có ghi hình, rồi đổi ngay.", "tag": "D5"}, {"o": "b-rev", "en": "Every quarter each manager re-approves their team. Unapproved access is removed automatically — that is how privilege creep dies.", "vi": "Mỗi quý trưởng phòng duyệt lại đội mình. Quyền không được duyệt sẽ tự bị gỡ — đó là cách privilege creep chết.", "tag": "D5"}], "c": {"dk-sd": [210, 220], "p-sd": [312, 296], "b-iaaa": [580, 185], "b-mfa": [580, 345], "b-rbac": [580, 505], "b-pam": [940, 185], "b-kerb": [940, 345], "b-rev": [940, 505]}}, {"id": "s7", "dom": "D3", "en": "The server room", "vi": "Phòng máy chủ", "lead_en": "Behind this door the exam stops being about policy and starts being about engineering.", "lead_vi": "Sau cánh cửa này, bài thi thôi nói về chính sách và bắt đầu nói về kỹ thuật.", "steps": [{"o": "rk-hsm", "en": "Keys that matter are generated inside the HSM and never leave it. Recovery needs three of five cards.", "vi": "Những khóa quan trọng được sinh bên trong HSM và không bao giờ rời khỏi đó. Khôi phục cần ba trong năm thẻ.", "tag": "D3"}, {"o": "b-tpm", "en": "The disk key lives in the TPM, so a stolen drive in another machine reads as noise.", "vi": "Khóa ổ đĩa nằm trong TPM, nên tháo ổ sang máy khác thì chỉ đọc ra nhiễu.", "tag": "D3"}, {"o": "b-hybrid", "en": "Every HTTPS session: asymmetric crypto carries the session key, then fast symmetric crypto carries the data.", "vi": "Mọi phiên HTTPS đều vậy: mật mã bất đối xứng chở khóa phiên, rồi mật mã đối xứng tốc độ cao chở dữ liệu.", "tag": "D3"}, {"o": "b-blp", "en": "Bell-LaPadula protects secrets: no read up, no write down. Biba protects accuracy and mirrors it exactly.", "vi": "Bell-LaPadula giữ bí mật: không đọc lên, không ghi xuống. Biba giữ tính chính xác và đối xứng ngược lại hoàn toàn.", "tag": "D3"}, {"o": "b-fire", "en": "Preaction needs both a detector and a melted sprinkler head, so a false alarm does not flood the racks.", "vi": "Hệ preaction cần cả cảm biến báo và đầu phun vỡ, nên một lần báo động giả không làm ngập các tủ rack.", "tag": "D7"}, {"o": "b-ups", "en": "The UPS buys fifteen minutes. The generator must start inside that window — and the only proof is a test.", "vi": "UPS mua cho bạn mười lăm phút. Máy phát phải nổ trong khoảng đó — và bằng chứng duy nhất là một lần diễn tập.", "tag": "D7"}], "c": {"rk-vm": [185, 230], "rk-db": [315, 230], "rk-hsm": [445, 230], "b-tpm": [685, 170], "b-ring": [965, 170], "b-blp": [685, 320], "b-hybrid": [965, 320], "b-fire": [350, 500], "b-ups": [845, 500]}}, {"id": "s8", "dom": "D8", "en": "The developers' pods", "vi": "Khu lập trình viên", "lead_en": "The cheapest defect is removed here, at a whiteboard, before anyone writes a line.", "lead_vi": "Lỗi rẻ nhất được gỡ ở đây, trên một tấm bảng trắng, trước khi ai đó viết dòng mã đầu tiên.", "steps": [{"o": "b-stride", "en": "Spoofing, tampering, repudiation, information disclosure, denial of service, elevation of privilege. Six questions asked at design time.", "vi": "Giả mạo, sửa đổi, chối bỏ, lộ thông tin, từ chối dịch vụ, leo thang đặc quyền. Sáu câu hỏi đặt ra ở pha thiết kế.", "tag": "D8"}, {"o": "b-sast", "en": "Static analysis reads the source without running it, and catches the concatenated SQL string on line 214.", "vi": "Phân tích tĩnh đọc mã nguồn mà không chạy nó, và bắt được câu SQL nối chuỗi ở dòng 214.", "tag": "D8"}, {"o": "b-dast", "en": "Dynamic testing attacks the running app and needs no source, which is why it also works on vendor systems.", "vi": "Kiểm thử động tấn công ứng dụng đang chạy và không cần mã nguồn, nên dùng được cả với hệ thống mua ngoài.", "tag": "D8"}, {"o": "sc-pipe", "en": "The pipeline is a control. A dependency with a known CVE blocks the merge; nobody has to remember.", "vi": "Đường ống phát hành chính là một kiểm soát. Một thư viện có CVE đã biết sẽ chặn merge; không ai phải nhớ cả.", "tag": "D8"}, {"o": "b-inj", "en": "Every application attack starts with input that was trusted. Validation plus parameterized queries cuts the first link.", "vi": "Mọi tấn công ứng dụng đều bắt đầu từ dữ liệu đầu vào được tin tưởng. Kiểm tra đầu vào cộng truy vấn tham số cắt đứt mắt xích đầu tiên.", "tag": "D8"}, {"o": "p-sec", "en": "Fixing this at design costs hours. Fixing it after release costs an emergency release and a breach notification.", "vi": "Sửa ở pha thiết kế tốn vài giờ. Sửa sau khi phát hành tốn một đợt phát hành khẩn cấp và một thông báo vi phạm dữ liệu.", "tag": "D8"}], "c": {"dk-dev1": [210, 210], "dk-dev2": [210, 400], "p-dev": [322, 266], "p-sec": [322, 458], "b-stride": [590, 175], "b-sast": [590, 335], "b-dast": [590, 500], "sc-pipe": [940, 210], "b-inj": [940, 460]}}, {"id": "s9", "dom": "D6", "en": "The audit meeting", "vi": "Buổi làm việc với kiểm toán", "lead_en": "A control nobody tests is only an assumption with a budget line.", "lead_vi": "Một kiểm soát không ai kiểm chứng chỉ là một giả định có dòng ngân sách.", "steps": [{"o": "b-scan", "en": "A scan lists what might be wrong. A credentialed scan reads the patch list and stops guessing.", "vi": "Quét lỗ hổng liệt kê những gì có thể đang sai. Quét có tài khoản thì đọc thẳng danh sách bản vá và thôi đoán.", "tag": "D6"}, {"o": "b-pt", "en": "A penetration test proves exploitability. Without written authorization and an agreed scope, it is simply an intrusion.", "vi": "Pentest chứng minh khai thác được. Không có giấy phép bằng văn bản và phạm vi thống nhất thì đó chỉ là một vụ xâm nhập.", "tag": "D6"}, {"o": "p-aud", "en": "Internal audit reports to management. An external auditor exists so that someone outside your chain of command can say no.", "vi": "Kiểm toán nội bộ báo cáo cho ban giám đốc. Kiểm toán viên bên ngoài tồn tại để có người ngoài chuỗi chỉ huy của bạn dám nói không.", "tag": "D6"}, {"o": "sc-ev", "en": "Evidence is an exported report with a date and a query, not a screenshot of a screen at one moment.", "vi": "Bằng chứng là một báo cáo xuất ra có ngày và câu truy vấn, không phải ảnh chụp một màn hình trong một khoảnh khắc.", "tag": "D6"}, {"o": "b-soc2", "en": "Type I says the controls were designed well on one day. Type II proves they ran for six months.", "vi": "Type I nói kiểm soát được thiết kế tốt trong một ngày. Type II chứng minh chúng đã chạy suốt sáu tháng.", "tag": "D6"}, {"o": "p-comp", "en": "Separation again: the person who configures the control must not be the person who tests it.", "vi": "Lại là tách biệt nhiệm vụ: người cấu hình kiểm soát không được là người kiểm tra nó.", "tag": "D7"}], "c": {"dk-aud": [390, 270], "p-aud": [300, 146], "p-comp": [470, 146], "b-scan": [270, 485], "b-pt": [600, 485], "b-soc2": [930, 485], "sc-ev": [905, 225]}}, {"id": "s10", "dom": "D7", "en": "The SOC wall", "vi": "Phòng giám sát an ninh", "lead_en": "Four screens, two analysts, and the question of how fast you would know.", "lead_vi": "Bốn màn hình, hai nhân viên phân tích, và câu hỏi bạn sẽ biết nhanh đến mức nào.", "steps": [{"o": "sc-siem", "en": "One correlation rule turns two harmless logins into one high-severity incident. That is what a SIEM is for.", "vi": "Một luật tương quan biến hai lần đăng nhập vô hại thành một sự cố mức cao. SIEM sinh ra để làm việc đó.", "tag": "D7"}, {"o": "sc-edr", "en": "The EDR records which process spawned which. Word launching PowerShell is the sentence that gives it away.", "vi": "EDR ghi lại tiến trình nào sinh ra tiến trình nào. Word gọi PowerShell là câu nói lộ hết.", "tag": "D7"}, {"o": "b-ir", "en": "Containment comes before eradication, eradication before recovery. Rushing back online destroys the evidence and the root cause.", "vi": "Cô lập trước khi diệt, diệt trước khi khôi phục. Vội đưa hệ thống lên lại là phá cả bằng chứng lẫn nguyên nhân gốc.", "tag": "D7"}, {"o": "b-eviden", "en": "Order of volatility: memory first, disk later. Pulling the power is the fastest way to destroy the best evidence.", "vi": "Thứ tự dễ mất: bộ nhớ trước, đĩa sau. Rút điện là cách nhanh nhất để hủy mất bằng chứng tốt nhất.", "tag": "D7"}, {"o": "b-bcp", "en": "The BIA set these numbers. RTO plus work recovery time must fit inside the maximum tolerable downtime.", "vi": "BIA đặt ra những con số này. RTO cộng thời gian đối soát phải nằm gọn trong MTD.", "tag": "D7"}, {"o": "p-an2", "en": "The last phase is the one everyone skips. Without lessons learned, the same incident returns next quarter.", "vi": "Giai đoạn cuối là giai đoạn ai cũng bỏ. Không rút kinh nghiệm thì quý sau sự cố y hệt quay lại.", "tag": "D7"}], "c": {"sc-siem": [285, 210], "sc-edr": [655, 210], "p-an1": [250, 356], "p-an2": [430, 356], "b-ir": [975, 210], "b-eviden": [725, 465], "b-bcp": [980, 465]}}, {"id": "s11", "dom": "All", "en": "16:30 — the whole floor", "vi": "16 giờ 30 — nhìn lại cả sàn", "lead_en": "Same building, now with the eight domains written on it. This is the picture to carry into the exam.", "lead_vi": "Vẫn tòa nhà đó, giờ có tên tám domain viết lên trên. Đây là bức tranh nên mang theo vào phòng thi.", "steps": [{"o": "m-d1", "en": "Domain one sat in two rooms: the boardroom decided, HR executed. Governance is people and paper.", "vi": "Domain một nằm ở hai phòng: phòng họp quyết định, nhân sự thực thi. Quản trị là con người và giấy tờ.", "tag": "D1"}, {"o": "m-d2", "en": "Domain two was a filing room. Classification, owner, retention, destruction — before any technology.", "vi": "Domain hai là một phòng hồ sơ. Phân loại, chủ sở hữu, thời hạn lưu, tiêu hủy — trước mọi công nghệ.", "tag": "D2"}, {"o": "m-d3", "en": "Domain three lived behind the server room door: keys, chips, models and the machinery of trust.", "vi": "Domain ba sống sau cánh cửa phòng máy chủ: khóa, chip, mô hình và bộ máy của sự tin cậy.", "tag": "D3"}, {"o": "m-d4", "en": "Domain four was three racks and a wall diagram. Everything there decides which packet reaches whom.", "vi": "Domain bốn là ba tủ rack và một sơ đồ trên tường. Mọi thứ ở đó quyết định gói tin nào tới được ai.", "tag": "D4"}, {"o": "m-d5", "en": "Domain five was a desk where identity is handed out, and the place attackers phone first.", "vi": "Domain năm là cái bàn phát danh tính, và cũng là nơi kẻ tấn công gọi tới đầu tiên.", "tag": "D5"}, {"o": "m-d6", "en": "Domain six was a meeting where someone from outside asks for proof.", "vi": "Domain sáu là một buổi họp mà người từ bên ngoài đòi bằng chứng.", "tag": "D6"}, {"o": "m-d7", "en": "Domain seven was everywhere you walked: the door, the guard, the SOC, the backups, the fire system.", "vi": "Domain bảy ở khắp nơi bạn đi qua: cánh cửa, người bảo vệ, phòng SOC, bản sao lưu, hệ thống chữa cháy.", "tag": "D7"}, {"o": "m-d8", "en": "Domain eight was a whiteboard and a pipeline that refuses to ship broken code.", "vi": "Domain tám là một tấm bảng trắng và một đường ống từ chối phát hành mã lỗi.", "tag": "D8"}], "c": {"m-d1": [250, 180], "m-d2": [570, 180], "m-d3": [890, 180], "m-d4": [250, 350], "m-d5": [570, 350], "m-d6": [890, 350], "m-d7": [330, 515], "m-d8": [810, 515]}}];
const KEY = 'cissp-tour-v1';
let seen = {}; try{ seen = JSON.parse(localStorage.getItem(KEY)||'{}'); }catch(e){}
const save = ()=>{ try{ localStorage.setItem(KEY, JSON.stringify(seen)); }catch(e){} };
const $ = id => document.getElementById(id);
let si = 0, st = -1, timer = null;

function showScene(i, fromLead){
  si = i; st = -1;
  const sc = S[i];
  document.querySelectorAll('.scene').forEach(s=> s.classList.toggle('on', s.id === 'sv-'+sc.id));
  document.body.className = sc.dom.startsWith('D') ? sc.dom : 'D1';
  $('sTitle').innerHTML = sc.en + ' <em>· ' + sc.vi + '</em>';
  $('sTag').textContent = sc.dom;
  $('lEn').textContent = sc.en; $('lVi').textContent = sc.vi;
  $('lpEn').textContent = sc.lead_en; $('lpVi').textContent = sc.lead_vi;
  $('lead').classList.remove('off');
  $('dots').innerHTML = sc.steps.map(()=>'<i></i>').join('');
  $('cTag').textContent = ''; $('cEn').textContent = ''; $('cVi').textContent = '';
  $('sCount').textContent = `Phòng ${i+1}/${S.length}`;
  document.querySelectorAll('.rb').forEach((b,k)=>{
    b.classList.toggle('cur', k===i); b.classList.toggle('seen', !!seen[S[k].id]); });
  clearAll();
  if(window.innerWidth < 900) $('rail').classList.add('hide');
  if(fromLead) enter();
}
function clearAll(){
  const sc = S[si];
  document.querySelectorAll('#sv-'+sc.id+' .obj').forEach(o=> o.classList.remove('hot','dim'));
  const p = $('pov-'+sc.id); if(p) p.classList.remove('on');
}
function enter(){ $('lead').classList.add('off'); if(st < 0) goStep(0); }
function goStep(n){
  const sc = S[si];
  if(n < 0){ if(si > 0){ showScene(si-1); enter(); st = S[si].steps.length-1; paint(); } return; }
  if(n >= sc.steps.length){
    seen[sc.id] = 1; save(); prog(); stop();
    if(si < S.length-1) showScene(si+1); else { $('cEn').textContent = 'Hết chuyến đi. Bạn đã gặp cả tám domain.';
      $('cVi').textContent = 'End of the tour — all eight domains, in the rooms where they live.'; }
    return;
  }
  st = n; paint();
}
function paint(){
  const sc = S[si], s = sc.steps[st];
  document.body.className = s.tag;
  document.querySelectorAll('#sv-'+sc.id+' .obj').forEach(o=>{
    const hot = o.id === s.o;
    o.classList.toggle('hot', hot); o.classList.toggle('dim', !hot);
  });
  const c = sc.c[s.o], p = $('pov-'+sc.id);
  if(c && p){ p.classList.add('on'); p.setAttribute('transform', `translate(${c[0]},${c[1]})`); }
  $('cTag').textContent = s.tag === 'All' ? 'Tổng kết' : s.tag;
  $('cEn').textContent = s.en; $('cVi').textContent = s.vi;
  $('dots').innerHTML = sc.steps.map((x,i)=>`<i class="${i<=st?'ok':''}"></i>`).join('');
  $('sCount').textContent = `Phòng ${si+1}/${S.length} · bước ${st+1}/${sc.steps.length}`;
}
function prog(){
  const n = S.filter(x=> seen[x.id]).length;
  $('mbar').style.width = (n/S.length*100)+'%';
  document.querySelectorAll('.rb').forEach((b,k)=> b.classList.toggle('seen', !!seen[S[k].id]));
}
function stop(){ if(timer){ clearInterval(timer); timer = null; $('bPlay').textContent = '▶'; } }
$('bNext').onclick = ()=>{ if(!$('lead').classList.contains('off')) return enter(); goStep(st+1); };
$('bPrev').onclick = ()=> goStep(st-1);
$('bPlay').onclick = ()=>{
  if(timer) return stop();
  if(!$('lead').classList.contains('off')) enter();
  $('bPlay').textContent = '❚❚';
  timer = setInterval(()=>{
    const sc = S[si];
    if(st < sc.steps.length-1) goStep(st+1); else { goStep(st+1); }
  }, 4200);
};
$('lGo').onclick = enter;
$('menu').onclick = ()=> $('rail').classList.toggle('hide');
$('fs').onclick = ()=>{ if(document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen?.(); };
document.querySelectorAll('.rb').forEach((b,i)=> b.onclick = ()=>{ stop(); showScene(i); });
document.addEventListener('keydown', e=>{
  if(e.key === 'ArrowRight' || e.key === ' '){ e.preventDefault(); stop(); $('bNext').click(); }
  if(e.key === 'ArrowLeft'){ stop(); goStep(st-1); }
  if(e.key === 'f'){ $('fs').click(); }
  if(e.key === 'Escape'){ $('rail').classList.toggle('hide'); }
});
prog(); showScene(0);
</script>
